name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate workflow YAML
        # Guards against the class of bug that silently broke the daily cron:
        # a malformed .github/workflows/*.yml is rejected by GitHub with a 0s
        # failure and no digest. check-jsonschema validates each workflow file
        # against the official GitHub Actions schema (parse errors + bad keys +
        # structural mistakes) — stronger than a plain YAML parse.
        run: |
          check-jsonschema --builtin-schema vendor.github-workflows \
            .github/workflows/*.yml

      - name: Run tests
        # No deselects: the full suite must pass on any calendar date. The
        # archive "today" test is no longer wall-clock dependent — the newest
        # row is highlighted by position, not by comparing to datetime.now()
        # (see render_archive_html). tests/test_archive_v2.py pins that
        # contract from both directions so the quarantine can't come back.
        run: python -m pytest -q

      - name: Key-free digest smoke (do-no-harm gate)
        # The guaranteed-free path must render with NO ANTHROPIC_API_KEY set.
        run: |
          python content_finder.py --no-summarize --days 2 --top 10 \
            --format html --out /tmp/smoke.html
          test -s /tmp/smoke.html
